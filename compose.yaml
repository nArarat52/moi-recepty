name: moi-recepty
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recipes
      POSTGRES_USER: recipes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recipes_local_demo}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - recipe_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipes -d recipes"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://recipes:${POSTGRES_PASSWORD:-recipes_local_demo}@db:5432/recipes
      DEMO_MODE: "true"
    ports:
      - "${API_BIND:-127.0.0.1}:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  recipe_db:
